plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dtrader.digitalhuman'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dtrader.digitalhuman'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.4'
    }

    // The web app in ../../app is bundled as-is and served from
    // https://appassets.androidplatform.net/assets/ by WebViewAssetLoader.
    sourceSets {
        main {
            assets.srcDirs = ['../../app']
        }
    }

    androidResources {
        noCompress += ['wasm', 'gz', 'mp4', 'wav']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
