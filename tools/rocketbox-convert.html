<!doctype html><script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from './jsm/loaders/FBXLoader.js';
import { GLTFExporter } from './jsm/exporters/GLTFExporter.js';

const KEEP = [
  'AA_VI_10_aa','AA_VI_11_E','AA_VI_12_I','AA_VI_13_O','AA_VI_14_U','AA_VI_01_PP',
  'AK_03_BrowInnerUp','AK_07_CheekSquintLeft','AK_08_CheekSquintRight','AK_09_EyeBlinkLeft','AK_10_EyeBlinkRight',
  'AK_21_EyeWideLeft','AK_22_EyeWideRight','AK_25_JawOpen',
  'AK_30_MouthFrownLeft','AK_31_MouthFrownRight','AK_44_MouthSmileLeft','AK_45_MouthSmileRight',
];

const params = new URLSearchParams(location.search);
const name = params.get('name');
const prefix = params.get('prefix');
const obj = await new FBXLoader().loadAsync(name + '_facial.fbx');
obj.scale.setScalar(0.01);
obj.updateMatrixWorld(true);
const bone = (n) => obj.getObjectByName('Bip01_' + n);

// --- re-pose arms into a T-pose (palms down) and re-bind ---
const wp = (o) => o.getWorldPosition(new THREE.Vector3());
function aim(b, child, target) {
  obj.updateMatrixWorld(true);
  const d = wp(child).sub(wp(b)).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(d, target);
  const bw = b.getWorldQuaternion(new THREE.Quaternion());
  const pw = b.parent.getWorldQuaternion(new THREE.Quaternion());
  b.quaternion.copy(pw.invert().multiply(q.multiply(bw)));
  obj.updateMatrixWorld(true);
}
function roll(b, axis, fromN, toN) {
  const q = new THREE.Quaternion().setFromUnitVectors(fromN, toN);
  const bw = b.getWorldQuaternion(new THREE.Quaternion());
  const pw = b.parent.getWorldQuaternion(new THREE.Quaternion());
  b.quaternion.copy(pw.invert().multiply(q.multiply(bw)));
  obj.updateMatrixWorld(true);
}
for (const [S, s] of [['L', 1], ['R', -1]]) {
  const out = new THREE.Vector3(s, 0, 0);
  aim(bone(S + '_UpperArm'), bone(S + '_Forearm'), out);
  aim(bone(S + '_Forearm'), bone(S + '_Hand'), out);
  aim(bone(S + '_Hand'), bone(S + '_Finger2'), out);
  // Palm down: the palm normal is perpendicular to the hand axis and to the
  // index→little knuckle line; rotate about the hand axis to point it at -Y.
  const across = wp(bone(S + '_Finger1')).sub(wp(bone(S + '_Finger4'))).normalize();
  const n = new THREE.Vector3().crossVectors(out, across).multiplyScalar(s).normalize();
  const nProj = n.clone().sub(out.clone().multiplyScalar(n.dot(out))).normalize();
  roll(bone(S + '_Hand'), out, nProj, new THREE.Vector3(0, -1, 0));
  for (const f of ['1', '2', '3', '4']) {
    aim(bone(S + '_Finger' + f), bone(S + '_Finger' + f + '1'), out);
    aim(bone(S + '_Finger' + f + '1'), bone(S + '_Finger' + f + '2'), out);
  }
}
window.palmCheck = 'ok';

let mesh;
obj.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
// Bake the T-pose into the mesh itself (CPU skinning), then make it the bind
// pose, so rotations from the app are relative to a true T-pose.
{
  const pos = mesh.geometry.attributes.position;
  const nor = mesh.geometry.attributes.normal;
  const p = new THREE.Vector3(), q = new THREE.Vector3(), n = new THREE.Vector3();
  const outPos = new Float32Array(pos.count * 3), outNor = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    q.copy(p).addScaledVector(n, 0.5);
    mesh.applyBoneTransform(i, p);
    mesh.applyBoneTransform(i, q);
    q.sub(p).normalize();
    outPos.set([p.x, p.y, p.z], i * 3);
    outNor.set([q.x, q.y, q.z], i * 3);
  }
  pos.array.set(outPos); pos.needsUpdate = true;
  nor.array.set(outNor); nor.needsUpdate = true;
  mesh.geometry.computeBoundingBox(); mesh.geometry.computeBoundingSphere();
}
mesh.skeleton.calculateInverses();
mesh.bind(mesh.skeleton, mesh.matrixWorld);

// --- keep only the blendshapes the app uses ---
const dict = mesh.morphTargetDictionary;
const keepIdx = [];
const newDict = {};
for (const k of KEEP) {
  const full = Object.keys(dict).find((n) => n.endsWith('.' + k));
  if (full == null) { console.warn('missing', k); continue; }
  newDict[k] = keepIdx.length;
  keepIdx.push(dict[full]);
}
// Morph normals roughly double the file size for little visual gain.
delete mesh.geometry.morphAttributes.normal;
for (const attr of Object.keys(mesh.geometry.morphAttributes)) {
  mesh.geometry.morphAttributes[attr] = keepIdx.map((i) => mesh.geometry.morphAttributes[attr][i]);
}
mesh.morphTargetDictionary = newDict;
mesh.morphTargetInfluences = keepIdx.map(() => 0);
mesh.updateMorphTargets && null;

// --- materials with our compressed textures ---
const tl = new THREE.TextureLoader();
const tex = async (f, srgb) => {
  const t = await tl.loadAsync('tex/' + f);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.userData.mimeType = f.endsWith('.png') ? 'image/png' : 'image/jpeg';
  return t;
};
const mats = [].concat(mesh.material);
const out = [];
for (const m of mats) {
  const lname = m.name.toLowerCase();
  let nm;
  if (lname.includes('body')) nm = new THREE.MeshStandardMaterial({ name: 'body', map: await tex('body_color.jpg', true), normalMap: await tex('body_normal.jpg'), roughness: 0.7, metalness: 0 });
  else if (lname.includes('head')) nm = new THREE.MeshStandardMaterial({ name: 'head', map: await tex('head_color.jpg', true), normalMap: await tex('head_normal.jpg'), roughness: 0.55, metalness: 0 });
  else nm = new THREE.MeshStandardMaterial({ name: 'opacity', map: await tex('opacity.png', true), roughness: 0.6, metalness: 0, transparent: false, alphaTest: 0.35, side: THREE.DoubleSide });
  out.push(nm);
}
mesh.material = out;
window.uvFlip = mats.map(m => m.map && m.map.flipY);

const glb = await new GLTFExporter().parseAsync(obj, { binary: true, onlyVisible: true });
const bytes = new Uint8Array(glb);
let s = '';
for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
window.glbB64 = btoa(s);
window.done = { verts: mesh.geometry.attributes.position.count, size: bytes.length, morphs: Object.keys(newDict).length, mats: out.map(m => m.name) };
</script>
