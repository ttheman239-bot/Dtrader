name: Android Release APK

on:
  push:
    branches:
      - "claude/build-android-apk-release-**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "Found APK: $APK"
          cp "$APK" "Dtrader-${GITHUB_SHA::7}.apk"
          echo "path=Dtrader-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtrader-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Compute release tag
        id: tag
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "tag=v1.0.0-${TS}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Dtrader ${{ steps.tag.outputs.tag }}"
          body: |
            ## Dtrader Android APK

            Day-trader workflow companion (AI + Power + Infra narrative).

            **Install:** download `${{ steps.apk.outputs.path }}`, allow installs from
            unknown sources for your file manager / browser, then open the APK.

            Built from commit `${{ github.sha }}` on branch
            `${{ github.ref_name }}`.

            APK is signed with the Android debug key.
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
